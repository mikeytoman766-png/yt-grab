<!DOCTYPE html>
<html lang="en" class="bg-ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<title>YT Grab</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { ink: '#0B1020', panel: '#141B2E', line: '#27314E', mute: '#8A95B3', gold: '#FFB547' },
  fontFamily: { sans: ['Sora', 'system-ui', 'sans-serif'] }
}}};
</script>
<style>
  @keyframes slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(350%) } }
  .indeterminate { animation: slide 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .indeterminate { animation: none; width: 100% !important; } .animate-spin { animation: none; } }
</style>
</head>
<body class="font-sans text-slate-100 min-h-screen flex items-start sm:items-center justify-center p-4"
      style="padding-bottom: max(1rem, env(safe-area-inset-bottom))">
<main class="w-full max-w-md">
  <h1 class="text-3xl font-bold tracking-tight mb-1">YT Grab<span class="text-gold">.</span></h1>
  <p class="text-mute text-sm mb-6">Save a video in up to 4K, or just the audio.</p>

  <section class="bg-panel border border-line rounded-3xl p-4">
    <label for="url" class="text-sm text-mute">YouTube link</label>
    <div class="flex gap-2 mt-2">
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://youtu.be/…"
             class="min-w-0 flex-1 h-14 rounded-2xl bg-ink border border-line px-4 text-base focus:outline-none focus:ring-2 focus:ring-gold">
      <button id="paste" type="button" class="h-14 px-4 rounded-2xl border border-line text-sm font-semibold active:bg-ink focus:outline-none focus:ring-2 focus:ring-gold">Paste</button>
    </div>
    <button id="analyze" type="button"
            class="mt-3 w-full h-14 rounded-2xl bg-gold text-ink font-bold text-base active:scale-[.98] transition disabled:opacity-50 focus:outline-none focus:ring-2 focus:ring-white">
      Analyze
    </button>
  </section>

  <p id="error" role="alert" class="hidden mt-4 rounded-2xl border border-red-500/40 bg-red-500/10 text-red-200 text-sm p-4"></p>

  <section id="result" class="hidden mt-4 bg-panel border border-line rounded-3xl overflow-hidden">
    <img id="thumb" alt="" class="w-full aspect-video object-cover bg-ink">
    <div class="p-4">
      <h2 id="title" class="font-semibold leading-snug"></h2>
      <p id="meta" class="text-mute text-sm mt-1"></p>

      <label for="format" class="block text-sm text-mute mt-4">Quality</label>
      <select id="format" class="mt-2 w-full h-14 rounded-2xl bg-ink border border-line px-4 text-base focus:outline-none focus:ring-2 focus:ring-gold"></select>

      <button id="download" type="button"
              class="mt-3 w-full h-14 rounded-2xl bg-gold text-ink font-bold text-base active:scale-[.98] transition disabled:opacity-50 focus:outline-none focus:ring-2 focus:ring-white">
        Download
      </button>

      <div id="progress" class="hidden mt-4" aria-live="polite">
        <div class="flex items-center gap-3 text-sm">
          <svg class="animate-spin h-5 w-5 text-gold shrink-0" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          <span id="status"></span>
        </div>
        <div class="mt-3 h-2 rounded-full bg-ink overflow-hidden">
          <div id="bar" class="h-full rounded-full bg-gold w-1/3"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const API = '';
let current = { url: '', title: '' };

const show = (el, on) => el.classList.toggle('hidden', !on);
const fail = msg => { $('error').textContent = msg; show($('error'), true); };
const clearError = () => show($('error'), false);
const sanitize = s => s.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').replace(/^[.\s]+|[.\s]+$/g, '').slice(0, 120) || 'video';
const fmtTime = s => {
  if (!s) return '';
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
};

$('paste').onclick = async () => {
  try { $('url').value = (await navigator.clipboard.readText()).trim(); }
  catch { fail('Clipboard access was blocked. Long-press the field and choose Paste.'); }
};

$('analyze').onclick = async () => {
  const url = $('url').value.trim();
  clearError(); show($('result'), false);
  if (!url) return fail('Paste a YouTube link first.');
  $('analyze').disabled = true; $('analyze').textContent = 'Analyzing…';
  try {
    const res = await fetch(`${API}/inspect?url=${encodeURIComponent(url)}`);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Could not analyze this link.');
    current = { url, title: data.title };
    $('thumb').src = data.thumbnail || '';
    $('title').textContent = data.title;
    $('meta').textContent = [data.uploader, fmtTime(data.duration)].filter(Boolean).join(' · ');
    $('format').innerHTML = data.options.map(o =>
      `<option value="${o.format_id}" data-kind="${o.kind}">${o.label}${o.size_mb ? ` (~${o.size_mb} MB video)` : ''}</option>`).join('');
    show($('result'), true);
    $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (e) { fail(e.message); }
  finally { $('analyze').disabled = false; $('analyze').textContent = 'Analyze'; }
};

$('download').onclick = async () => {
  clearError();
  const sel = $('format'), isAudio = sel.selectedOptions[0].dataset.kind === 'audio';
  const bar = $('bar');
  $('download').disabled = true; $('analyze').disabled = true;
  show($('progress'), true);
  bar.className = 'h-full rounded-full bg-gold w-1/3 indeterminate';
  $('status').textContent = isAudio
    ? 'Converting to MP3 on the server. Keep this page open.'
    : 'Downloading and merging video + audio. High resolutions can take a few minutes.';
  try {
    const res = await fetch(`${API}/download`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: current.url, format_id: sel.value })
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || 'Download failed.');
    }
    const total = +res.headers.get('Content-Length') || 0;
    const reader = res.body.getReader(), chunks = []; let got = 0;
    bar.className = 'h-full rounded-full bg-gold'; bar.style.width = '0%';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      $('status').textContent = total
        ? `Receiving file… ${Math.round(got / total * 100)}%`
        : `Receiving file… ${(got / 1048576).toFixed(1)} MB`;
      if (total) bar.style.width = (got / total * 100) + '%';
    }
    const blob = new Blob(chunks, { type: res.headers.get('Content-Type') || 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${sanitize(current.title)}.${isAudio ? 'mp3' : 'mp4'}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    $('status').textContent = 'Done. Check your Downloads or Files app.';
    bar.style.width = '100%';
  } catch (e) { show($('progress'), false); fail(e.message); }
  finally { $('download').disabled = false; $('analyze').disabled = false; bar.classList.remove('indeterminate'); }
};
</script>
</body>
</html>
